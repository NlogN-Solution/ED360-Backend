services:
  - type: web
    name: ed360-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt"
    # alembic upgrade head is idempotent (no-ops once already at head), so
    # running it on every boot — not just the first deploy — is safe and
    # means a new migration ships automatically with the next deploy.
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      # Managed Postgres connection string (Render Postgres or external) —
      # takes priority over DB_HOST/DB_PORT/etc. See app/core/config.py.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"
      # The deployed CRM frontend's URL (used in emails/links).
      - key: FRONTEND_URL
        sync: false
      # Comma-separated: your deployed CRM frontend + landing site origins.
      - key: CORS_ORIGINS
        sync: false
      # Fernet key — generate with:
      #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false
      # Cloudinary — required here (Render's filesystem is ephemeral).
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Optional integrations — leave unset to keep the corresponding
      # connect button hidden, same as local dev. See README.md for what
      # each one does.
      - key: META_APP_SECRET
        sync: false
      - key: META_GRAPH_API_URL
        value: https://graph.facebook.com
      - key: META_API_VERSION
        value: v25.0
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: META_APP_ID
        sync: false
      - key: WHATSAPP_EMBEDDED_SIGNUP_CONFIG_ID
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
